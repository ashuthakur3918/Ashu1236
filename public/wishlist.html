<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved — Frontier World</title></head><body><main id="main-content"><section class="page-hero"><div><p class="eyebrow">MY FRONTIER · SAVED</p><h1>Your saved<br><em>travel ideas.</em></h1><p>Keep destinations, experiences and stories in one place while you decide what comes next.</p></div></section><section class="section"><div id="savedPage" class="saved-grid"></div></section></main><script src="/app.js?v=106"></script><script>(async function(){const el=document.getElementById('savedPage');const r=await fetch('/api/wishlist');if(r.status===401){el.innerHTML='<div class="account-gate"><h2>Sign in to see your saved list.</h2><a class="btn orange" href="/login?returnTo=/wishlist.html">Sign in / create account →</a></div>';return;}const d=await r.json();el.innerHTML=(d.items||[]).map(function(x){return '<article class="saved-card saved-card-large"><div class="saved-card-img" style="background-image:url('+JSON.stringify(x.image_url||'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1000&q=80')+')"></div><div><small>'+x.item_type+'</small><strong>'+x.title+'</strong><span>'+x.subtitle+'</span><button class="text-btn" onclick="removeSaved('+JSON.stringify(x.id)+')">Remove</button></div></article>';}).join('')||'<div class="empty-card"><h3>No saved ideas yet.</h3><p>Browse destinations and things to do, then save the ones you want to revisit.</p><a href="/destinations.html">Explore destinations →</a></div>';})();async function removeSaved(id){await fetch('/api/wishlist',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});location.reload();}</script></body></html>
