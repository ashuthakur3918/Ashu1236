<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier CMS Preview</title><style>body{margin:0;background:#f4f7f5;color:#14211f;font:16px/1.6 system-ui}.wrap{max-width:1100px;margin:auto;padding:32px}.bar{position:sticky;top:0;background:#0b2d2a;color:#fff;padding:12px 18px;z-index:2}.hero{background:#fff;padding:42px;border-radius:18px;margin:20px 0;border:1px solid #dbe4e1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#fff;border:1px solid #dbe4e1;border-radius:16px;padding:18px}.muted{color:#687773}img{width:100%;height:160px;object-fit:cover;border-radius:12px}</style></head><body><div class="bar">CMS DRAFT PREVIEW · <span id="status">Loading…</span></div><main class="wrap" id="app"></main><script>(async function(){var r=await fetch("/api/cms/preview");if(!r.ok){document.getElementById("app").innerHTML="<div class=hero>CMS admin access is required for draft preview.</div>";return}var j=await r.json(),d=j.content||{},p=d.pages&&d.pages.home||{};document.getElementById("status").textContent=j.status+(j.updated_at?" · updated "+new Date(j.updated_at).toLocaleString():"");document.getElementById("app").innerHTML='<section class="hero"><small>'+esc(p.eyebrow||"FRONTIER WORLD")+'</small><h1>'+esc(p.headline||"Travel with context.")+'</h1><p>'+esc(p.subheadline||p.description||"")+'</p></section><h2>Destinations</h2><div class="grid">'+(d.destinations||[]).slice(0,8).map(function(x){return '<article class="card">'+(x.image?'<img src="'+esc(x.image)+'" alt="'+esc(x.name)+'">':"")+'<h3>'+esc(x.name)+'</h3><p>'+esc(x.note||"")+'</p><span class="muted">'+esc(x.region||"")+'</span></article>';}).join("")+'</div><h2>Stories</h2><div class="grid">'+(d.globalStories||[]).slice(0,6).map(function(x){return '<article class="card">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':"")+'<small>'+esc(x.type||"STORY")+'</small><h3>'+esc(x.title)+'</h3><p>'+esc(x.excerpt||"")+'</p></article>';}).join("")+'</div>';function esc(v){return String(v??"").replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]})}})()</script></body></html>
