<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Trips — Frontier World</title></head><body><main id="main-content"><section class="page-hero"><div><p class="eyebrow">MY FRONTIER · TRIPS</p><h1>Trips in progress.<br><em>Ideas taking shape.</em></h1><p>Keep your planning drafts together. Frontier treats them as flexible starting points, not bookings.</p><a class="btn orange" href="/plan.html">Create a trip plan →</a></div></section><section class="section"><div id="tripPage" class="itinerary-grid"></div></section></main><script src="/app.js?v=106"></script><script>(async function(){const el=document.getElementById('tripPage');const r=await fetch('/api/trips');if(r.status===401){el.innerHTML='<div class="account-gate"><h2>Sign in to see your trips.</h2><a class="btn orange" href="/login?returnTo=/my-trips.html">Sign in / create account →</a></div>';return;}const d=await r.json();el.innerHTML=(d.trips||[]).map(function(x){return '<article class="itinerary-card"><small>'+x.status.toUpperCase()+'</small><h3>'+x.title+'</h3><p>'+[x.destination,x.start_date&&('From '+x.start_date),x.end_date&&('to '+x.end_date)].filter(Boolean).join(' · ')+'</p><div><span>'+x.style+'</span><span>'+x.budget+'</span></div><button class="btn secondary" onclick="deleteTrip('+JSON.stringify(x.id)+')">Remove draft</button></article>';}).join('')||'<div class="empty-card"><h3>Your first trip is waiting.</h3><p>Start with dates, pace and interests. You can change everything later.</p><a href="/plan.html">Plan my trip →</a></div>';})();async function deleteTrip(id){await fetch('/api/trips',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});location.reload();}</script></body></html>
