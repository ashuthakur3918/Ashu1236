<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier World CMS</title><style>
:root{--wp-black:#0b2d2a;--wp-dark:#102824;--wp-blue:#d96b32;--wp-blue-dark:#b95725;--wp-purple:#d96b32;--wp-bg:#f4f7f5;--wp-card:#fff;--wp-border:#dbe4e1;--wp-text:#14211f;--wp-muted:#687773;--green:#2f7d68;--red:#a23b24}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--wp-bg);color:var(--wp-text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{height:56px;background:#0b2d2a;color:#fff;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 #000}.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px}.brand:before{content:"✦";display:inline-grid;place-items:center;width:28px;height:28px;background:var(--wp-purple);border-radius:9px;font-size:15px}.brand span{color:#a7aaad;font-weight:500}.top .actions{align-items:center}.top a{color:#fff;text-decoration:none;padding:8px 10px;border-radius:3px}.top a:hover{background:#32373c}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 56px)}aside{background:#102824;color:#f0f0f1;padding:12px 0;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;border-right:1px solid #2c3338}.group{font-size:10px;font-weight:700;letter-spacing:.08em;color:#8c8f94;margin:18px 12px 6px;text-transform:uppercase}.nav{width:100%;text-align:left;background:transparent;border:0;color:#f0f0f1;border-radius:0;padding:9px 16px;margin:0;min-height:38px;position:relative}.nav:before{display:inline-block;width:24px;margin-right:7px;opacity:.85}.nav[data-tab="dashboard"]:before{content:"⌂"}.nav[data-tab="pages"]:before{content:"▤"}.nav[data-tab="destinations"]:before{content:"◉"}.nav[data-tab="activities"]:before{content:"✦"}.nav[data-tab="experiences"]:before{content:"★"}.nav[data-tab="stays"]:before{content:"⌂"}.nav[data-tab="treks"]:before{content:"↗"}.nav[data-tab="foods"]:before{content:"●"}.nav[data-tab="festivals"]:before{content:"✷"}.nav[data-tab="seasons"]:before{content:"◒"}.nav[data-tab="routes"]:before{content:"⌁"}.nav[data-tab="itineraries"]:before{content:"☷"}.nav[data-tab="globalStories"]:before{content:"▰"}.nav[data-tab="leads"]:before{content:"✉"}.nav[data-tab="media"]:before{content:"▧"}.nav[data-tab="settings"]:before{content:"⚙"}.nav[data-tab="revisions"]:before{content:"↶"}.nav[data-tab="raw"]:before{content:"{}"}.nav:hover{background:#2c3338;color:#fff}.nav.active{background:#2271b1;color:#fff}.nav .count{float:right;background:#8c8f94;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-top:1px}
main{padding:28px 30px 45px;max-width:1600px;width:100%;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:20px}.head h1{font-size:30px;line-height:1.2;font-weight:600;margin:0}.head p{margin:5px 0 0;color:var(--wp-muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#fff;color:#2c3338;border:1px solid var(--wp-border);border-radius:3px;padding:7px 12px;box-shadow:0 1px 0 #0000000d}.btn:hover{border-color:#8c8f94;background:#f6f7f7}.btn.primary{background:var(--wp-blue);border-color:var(--wp-blue);color:#fff;font-weight:600}.btn.primary:hover{background:var(--wp-blue-dark)}.btn.dark{background:#1d2327;border-color:#1d2327;color:#fff}.btn.danger{color:var(--red)}
.notice{background:#fff;border-left:4px solid var(--wp-blue);border-top:1px solid var(--wp-border);border-right:1px solid var(--wp-border);border-bottom:1px solid var(--wp-border);padding:11px 13px;margin-bottom:16px}.notice.error{border-left-color:var(--red);color:#8a2424}
.stat{background:var(--wp-card);border:1px solid var(--wp-border);border-radius:0;padding:17px 18px;min-height:96px}.stat b{font-size:28px;line-height:1.1;display:block;color:#1d2327}.stat span{color:var(--wp-muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.panel{background:var(--wp-card);border:1px solid var(--wp-border);border-radius:0;padding:0;box-shadow:0 1px 1px #00000008}.panel h3{margin:0;padding:13px 16px;border-bottom:1px solid var(--wp-border);font-size:14px}.dashboard-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:18px}.widget{background:#fff;border:1px solid var(--wp-border);box-shadow:0 1px 1px #00000008}.widget-head{padding:13px 15px;border-bottom:1px solid var(--wp-border);display:flex;justify-content:space-between;align-items:center}.widget-head strong{font-size:14px}.widget-head small{color:var(--wp-muted)}.widget-body{padding:15px}.widget-list{list-style:none;padding:0;margin:0}.widget-list li{padding:11px 0;border-bottom:1px solid #f0f0f1;display:flex;justify-content:space-between;gap:10px}.widget-list li:last-child{border-bottom:0}.widget-list a{color:var(--wp-blue);text-decoration:none;font-weight:500}.progress{height:8px;background:#f0f0f1;margin:10px 0 15px;overflow:hidden}.progress span{display:block;height:100%;background:var(--wp-purple)}.setup-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f1}.setup-row:last-child{border-bottom:0}.check{width:21px;height:21px;border-radius:50%;border:1px solid #c3c4c7;display:grid;place-items:center;font-size:12px}.check.done{background:var(--green);border-color:var(--green);color:#fff}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.quick button{background:#fff;border:1px solid var(--wp-border);border-radius:0;text-align:left;padding:16px;min-height:90px}.quick button:hover{border-color:#8c8f94;box-shadow:0 1px 3px #0001}.quick strong{display:block;font-size:14px;margin-bottom:5px}.quick span{color:var(--wp-muted);font-size:12px}
.items{display:grid;gap:12px}.item{background:#fff;border:1px solid var(--wp-border);border-radius:0;padding:14px}.itemhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.itemhead strong{font-size:15px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#50575e;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:8px;border:1px solid #8c8f94;border-radius:2px;background:#fff;color:#1d2327}.field input:focus,.field textarea:focus,.field select:focus{outline:1px solid var(--wp-blue);border-color:var(--wp-blue)}.field textarea{min-height:88px;resize:vertical}.bar{position:sticky;bottom:15px;margin-top:16px;background:#1d2327;color:#fff;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 18px #0003}.tablewrap{overflow:auto}.leads{width:100%;border-collapse:collapse;min-width:900px}.leads th,.leads td{padding:10px;border-bottom:1px solid var(--wp-border);text-align:left;vertical-align:top}.leads th{font-size:11px;color:var(--wp-muted);text-transform:uppercase}.media{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.media-card{background:#fff;border:1px solid var(--wp-border);border-radius:0;overflow:hidden}.media-card img{width:100%;height:145px;object-fit:cover;background:#e8eaeb}.media-body{padding:11px}.media-body input{width:100%;padding:7px;border:1px solid #8c8f94;border-radius:2px;margin:4px 0}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings .panel h3{margin-top:0}.raw{width:100%;min-height:500px;font:12px ui-monospace,monospace}.revision{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--wp-border)}.muted{color:var(--wp-muted)}
@media(max-width:1100px){.dashboard-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.quick,.media,.settings{grid-template-columns:1fr 1fr}}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{height:auto;position:static;display:flex;overflow:auto;gap:0;padding:0}.group{display:none}.nav{white-space:nowrap;width:auto}.stats,.quick,.media,.settings{grid-template-columns:1fr 1fr}main{padding:18px}}@media(max-width:600px){.stats,.quick,.media,.settings,.fields{grid-template-columns:1fr}.head{flex-direction:column;align-items:start}.head h1{font-size:26px}}
.top{border-bottom:1px solid #234b44}.nav{border-radius:9px;margin:2px 8px;width:calc(100% - 16px)}.nav:hover{background:#244a43}.nav.active{background:#d96b32}.nav .count{background:#42635c}.btn{border-radius:10px}.btn.primary{background:#d96b32;border-color:#d96b32}.btn.primary:hover{background:#b95725}.btn.dark{background:#0b2d2a;border-color:#0b2d2a;border-radius:10px}.notice{border-radius:12px;border-left:4px solid #d96b32}.stat,.panel,.widget,.quick button,.item,.media-card{border-radius:16px}.stat{box-shadow:0 2px 10px rgba(11,45,42,.05)}.widget{overflow:hidden}.widget-head{border-radius:16px 16px 0 0}.quick button{transition:transform .15s ease,box-shadow .15s ease}.quick button:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(11,45,42,.09)}.field input,.field textarea,.field select,.media-body input{border-radius:9px}.bar{border-radius:14px}.settings .panel{overflow:hidden}.revision{border-radius:10px;margin:6px 8px;border:1px solid #eef2f0}.tablewrap{border-radius:16px;overflow:auto}.leads select{border-radius:8px;padding:6px;border:1px solid #c8d5d1;background:#fff}.progress{border-radius:99px;background:#eaf1ee}.progress span{background:#d96b32;border-radius:99px}</style></head><body><header class="top"><div class="brand">✦ FRONTIER <span>WORLD CMS</span></div><div class="actions"><button class="btn" id="topShare">Share</button><button class="btn" id="topProfile">Profile</button><a href="/">View site ↗</a></div></header><div class="layout"><aside id="nav"></aside><main id="app"></main></div>
<script>
(function(){
var S={tab:"dashboard",content:null,draft:null,draftStatus:"draft",scheduledAt:null,settings:null,model:null,platform:null,profile:null,profileEmail:"",profileRole:"owner",leads:[],media:[],revisions:[]};
var cols=[["destinations","Destinations"],["activities","Activities"],["experiences","Experiences"],["stays","Stays"],["treks","Treks"],["foods","Food"],["festivals","Festivals"],["seasons","Seasons"],["routes","Routes"],["itineraries","Itineraries"],["globalStories","Stories"]];
var groups=[["SITE","dashboard","Overview"],["SITE","profile","My Profile"],["SITE","publishing","Publishing"],["SITE","analytics","Analytics"],["SITE","infrastructure","Hosting & Domain"],["SITE","team","Admin Access"],["SITE","plugins","Plugins"],["SITE","businessModel","Business Model"],["SITE","platform","Platform Tools"],["CONTENT","universal","Universal Content"],["CONTENT","pages","Pages & SEO"],["CONTENT","destinations","Destinations"],["CONTENT","destinationDetails","Destination details"],["CONTENT","taxonomies","Categories & tags"],["CONTENT","activities","Activities"],["CONTENT","experiences","Experiences"],["CONTENT","stays","Stays"],["CONTENT","treks","Treks"],["CONTENT","foods","Food"],["CONTENT","festivals","Festivals"],["CONTENT","seasons","Seasons"],["CONTENT","routes","Routes"],["CONTENT","itineraries","Itineraries"],["CONTENT","globalStories","Stories"],["BUSINESS","leads","Leads"],["BUSINESS","media","Media library"],["SITE","settings","Site settings"],["SITE","revisions","History & restore"],["SITE","raw","Advanced JSON"]];
var app=document.getElementById("app"),nav=document.getElementById("nav");
function esc(v){return String(v??"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]});}
function api(u,o){return fetch(u,o).then(async r=>{var j={};try{j=await r.json()}catch(e){}if(r.status===401){var e=new Error("Sign-in required to open the CMS.");e.code="AUTH_REQUIRED";throw e}if(r.status===403){var e2=new Error(j.message||j.error||"Admin access required.");e2.code="ADMIN_REQUIRED";throw e2}if(!r.ok)throw Error(j.message||j.error||"Request failed");return j})}
function flash(m,err){var n=document.createElement("div");n.className="notice "+(err?"error":"");n.textContent=m;app.prepend(n);setTimeout(()=>n.remove(),2500)}
function navRender(){nav.innerHTML=groups.map(g=>g[0]).filter((x,i,a)=>a.indexOf(x)===i).map(g=>'<div class="group">'+g+'</div>'+groups.filter(x=>x[0]===g).map(x=>'<button class="nav '+(S.tab===x[1]?"active":"")+'" data-tab="'+x[1]+'">'+x[2]+(x[1]==="leads"?'<span class="count">'+S.leads.length+"</span>":"")+'</button>').join("")).join("");nav.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()})}
function head(title,sub,buttons){return '<div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+(buttons||"")+"</div></div>"}
function dashboard(){var total=cols.reduce((n,c)=>n+(Array.isArray(S.content[c[0]])?S.content[c[0]].length:0),0),pages=Object.keys(S.content.pages||{}).length,setup=0;setup+=S.content.pages&&S.content.pages.home?1:0;setup+=S.media.length?1:0;setup+=S.settings&&S.settings.siteName?1:0;setup+=S.settings&&S.settings.contact&&S.settings.contact.email?1:0;setup+=S.leads.length?1:0;var pct=Math.round(setup/5*100);var recent=S.revisions.slice(0,5);app.innerHTML=head("Dashboard","Welcome to Frontier World. Manage your website from one admin workspace.",'<button class="btn" id="viewsite">View site</button><button class="btn dark" id="refresh">Refresh</button>')+'<div class="stats"><div class="stat"><b>'+total+'</b><span>Published content items</span></div><div class="stat"><b>'+S.leads.length+'</b><span>Leads & enquiries</span></div><div class="stat"><b>'+S.media.length+'</b><span>Media assets</span></div><div class="stat"><b>'+pages+'</b><span>Managed pages</span></div><div class="stat"><b>'+S.revisions.length+'</b><span>Restore points</span></div></div><div class="dashboard-grid"><section class="widget"><div class="widget-head"><strong>Site setup</strong><small>'+pct+'% complete</small></div><div class="widget-body"><div class="progress"><span style="width:'+pct+'%"></span></div><div class="setup-row"><span class="check '+(S.content.pages&&S.content.pages.home?'done':'')+'">'+(S.content.pages&&S.content.pages.home?'✓':'')+'</span><div><b>Personalize your site</b><div class="muted">Edit the homepage hero, SEO and key page copy.</div></div><button class="btn" data-q="pages">Open</button></div><div class="setup-row"><span class="check '+(S.media.length?'done':'')+'">'+(S.media.length?'✓':'')+'</span><div><b>Add media</b><div class="muted">Build a reusable library for your images.</div></div><button class="btn" data-q="media">Open</button></div><div class="setup-row"><span class="check '+(S.settings&&S.settings.siteName?'done':'')+'">'+(S.settings&&S.settings.siteName?'✓':'')+'</span><div><b>Configure site identity</b><div class="muted">Brand, contact, social and analytics settings.</div></div><button class="btn" data-q="settings">Open</button></div><div class="setup-row"><span class="check '+(S.leads.length?'done':'')+'">'+(S.leads.length?'✓':'')+'</span><div><b>Review enquiries</b><div class="muted">Track and update incoming travel requests.</div></div><button class="btn" data-q="leads">Open</button></div></div></section><section class="widget"><div class="widget-head"><strong>Recent activity</strong><small>Latest saves</small></div><div class="widget-body"><ul class="widget-list">'+(recent.length?recent.map(r=>'<li><div><a href="#" data-q="revisions">'+esc(r.note||'Content snapshot')+'</a><div class="muted">'+new Date(r.created_at).toLocaleString()+'</div></div><span>↶</span></li>').join(''):'<li><span class="muted">No snapshots yet.</span></li>')+'</ul><button class="btn" style="margin-top:10px" data-q="revisions">View history</button></div></section></div><div class="quick"><button data-q="pages"><strong>✎ Edit pages & SEO</strong><span>Titles, descriptions, hero copy and indexing controls</span></button><button data-q="media"><strong>▣ Media library</strong><span>Reusable images, alt text, captions and folders</span></button><button data-q="settings"><strong>⚙ Site settings</strong><span>Branding, contact, social, analytics and footer</span></button><button data-q="profile"><strong>◉ My Profile</strong><span>Account identity, preferences and notifications</span></button><button id="dashShare"><strong>↗ Share demo</strong><span>Copy a dummy CMS share link or use your device share sheet</span></button><button data-q="leads"><strong>✉ Leads</strong><span>Review enquiries, trip requirements and status</span></button><button data-q="revisions"><strong>↶ History & restore</strong><span>Restore a previous CMS snapshot safely</span></button><button data-q="raw"><strong>{ } Advanced JSON</strong><span>Full content model for power users</span></button></div>';document.getElementById("refresh").onclick=load;document.getElementById("viewsite").onclick=()=>location.href="/";document.getElementById("topShare")?.addEventListener("click",shareDummy);document.getElementById("topProfile")?.addEventListener("click",()=>{S.tab="profile";render()});document.getElementById("dashShare")?.addEventListener("click",shareDummy);app.querySelectorAll("[data-q]").forEach(b=>b.onclick=e=>{if(e&&e.preventDefault)e.preventDefault();S.tab=b.dataset.q;render()})}
function pageEditor(){var pages=(S.draft&&S.draft.pages)||{};var names=["home","destinations","experiences","stays","plan","discover","live","journal","about","advertise","business","food","festivals","treks","itineraries","costs","essentials","search"];if(!Object.keys(pages).length)names.forEach(n=>pages[n]={title:"",description:"",eyebrow:"",headline:"",subheadline:"",heroImage:"",indexable:true});S.draft.pages=pages;app.innerHTML=head("Pages & SEO","Control the page-level copy and search metadata without changing HTML.",'<button class="btn primary" id="save">Save pages</button>')+'<div class="items">'+names.map((n,i)=>{var p=pages[n]||{};return '<article class="item pageitem" data-page="'+n+'"><div class="itemhead"><strong>'+n.replace(/-/g," ")+'</strong><span class="muted">'+(p.indexable===false?"Noindex":"Indexable")+'</span></div><div class="fields"><div class="field"><label>SEO title</label><input data-k="title" value="'+esc(p.title)+'"></div><div class="field"><label>Meta description</label><input data-k="description" value="'+esc(p.description)+'"></div><div class="field"><label>URL slug</label><input data-k="slug" value="'+esc(p.slug||n)+'"></div><div class="field"><label>Canonical URL</label><input data-k="canonical" value="'+esc(p.canonical||"")+'"></div><div class="field"><label>OG title</label><input data-k="ogTitle" value="'+esc(p.ogTitle||p.title||"")+'"></div><div class="field"><label>OG description</label><input data-k="ogDescription" value="'+esc(p.ogDescription||p.description||"")+'"></div><div class="field"><label>OG image URL</label><input data-k="ogImage" value="'+esc(p.ogImage||p.heroImage||"")+'"></div><div class="field"><label>Eyebrow</label><input data-k="eyebrow" value="'+esc(p.eyebrow)+'"></div><div class="field"><label>Headline</label><input data-k="headline" value="'+esc(p.headline)+'"></div><div class="field full"><label>Subheadline</label><textarea data-k="subheadline">'+esc(p.subheadline)+'</textarea></div><div class="field full"><label>Hero image URL</label><input data-k="heroImage" value="'+esc(p.heroImage)+'"></div><div class="field"><label>Index in search engines</label><select data-k="indexable"><option value="true" '+(p.indexable!==false?"selected":"")+'>Yes</option><option value="false" '+(p.indexable===false?"selected":"")+'>No</option></select></div></div></article>'}).join("")+'</div>';document.getElementById("save").onclick=()=>{document.querySelectorAll(".pageitem").forEach(card=>{var p=pages[card.dataset.page]||{};card.querySelectorAll("[data-k]").forEach(e=>p[e.dataset.k]=e.dataset.k==="indexable"?e.value==="true":e.value);pages[card.dataset.page]=p;S.draft.pages=pages});save()}}
function collection(k){var items=S.draft[k]||[];app.innerHTML=head((cols.find(x=>x[0]===k)||["",k])[1],items.length+" editable records.",'<button class="btn" id="add">+ Add</button><button class="btn primary" id="save">Save changes</button>')+'<div class="items" id="items">'+items.map((x,i)=>card(x,i)).join("")+'</div><div class="bar"><span>Saving creates a restore point automatically.</span><button class="btn primary" id="save2">Save changes</button></div>';document.getElementById("add").onclick=()=>{items.push({name:"New item",note:""});collection(k)};app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);collection(k)});document.getElementById("save").onclick=document.getElementById("save2").onclick=()=>{read(k);save()}}
function card(x,i){return '<article class="item rec"><div class="itemhead"><strong>'+esc(x.name||("Item "+(i+1)))+'</strong><button class="btn danger" data-del="'+i+'">Delete</button></div><div class="fields">'+Object.keys(x).map(k=>{var v=x[k];return '<div class="field '+(String(v).length>120?"full":"")+'"><label>'+esc(k.replace(/_/g," "))+'</label>'+(String(v).length>120?'<textarea data-k="'+esc(k)+'">'+esc(v)+'</textarea>':'<input data-k="'+esc(k)+'" value="'+esc(v)+'">')+'</div>'}).join("")+'</div></article>'}
function read(k){S.draft[k]=[...document.querySelectorAll(".rec")].map(c=>{var x={};c.querySelectorAll("[data-k]").forEach(e=>x[e.dataset.k]=e.value);return x})}
function save(){api("/api/cms/content",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:S.draft})}).then(j=>{S.draft=j.draft;S.draftStatus=j.status||"draft";S.scheduledAt=null;flash("Draft saved. Live site is unchanged until you publish.");render()}).catch(e=>flash(e.message,true))}
function analytics(){app.innerHTML=head("Analytics","Understand what visitors do across Frontier World.",'<button class="btn" id="ra">Refresh</button>')+'<div id="analyticsBox"><div class="notice">Loading analytics…</div></div>';function draw(j){var t=j.totals||{};document.getElementById("analyticsBox").innerHTML='<div class="stats"><div class="stat"><b>'+esc(t.events||0)+'</b><span>Tracked events</span></div><div class="stat"><b>'+esc((j.pages||[]).length)+'</b><span>Top pages returned</span></div><div class="stat"><b>'+esc((j.events||[]).length)+'</b><span>Event types</span></div></div><div class="dashboard-grid"><section class="widget"><div class="widget-head"><strong>Top pages</strong></div><div class="widget-body"><ul class="widget-list">'+(j.pages||[]).map(x=>'<li><span>'+esc(x.page_path||"unknown")+'</span><b>'+esc(x.count)+'</b></li>').join("")+'</ul></div></section><section class="widget"><div class="widget-head"><strong>Events</strong></div><div class="widget-body"><ul class="widget-list">'+(j.events||[]).map(x=>'<li><span>'+esc(x.event_name)+'</span><b>'+esc(x.count)+'</b></li>').join("")+'</ul></div></section></div><section class="widget" style="margin-top:18px"><div class="widget-head"><strong>Sources</strong></div><div class="widget-body"><ul class="widget-list">'+(j.sources||[]).map(x=>'<li><span>'+esc(x.source||"direct")+'</span><b>'+esc(x.count)+'</b></li>').join("")+'</ul></div></section>'}function loadA(){api("/api/cms/analytics").then(draw).catch(e=>flash(e.message,true))}document.getElementById("ra").onclick=loadA;loadA()}

function universalInput(f,v){
 var val=v==null?"":v;
 if(f.type==="boolean")return '<input data-uf type="checkbox" '+(val===true?"checked":"")+'>';
 if(f.type==="textarea"||f.type==="richtext"||f.type==="json")return '<textarea data-uf placeholder="'+esc(f.type==="json"?"Valid JSON":"")+'">'+esc(typeof val==="object"?JSON.stringify(val,null,2):val)+'</textarea>';
 if(f.type==="select")return '<select data-uf><option value="">Select...</option>'+((f.options||[]).map(o=>'<option '+(String(val)===String(o)?"selected":"")+'>'+esc(o)+'</option>').join(""))+'</select>';
 if(f.type==="multiselect")return '<input data-uf value="'+esc(Array.isArray(val)?val.join(", "):val)+'" placeholder="Comma separated">';
 if(f.type==="number"||f.type==="currency")return '<input data-uf type="number" step="any" value="'+esc(val)+'">';
 if(f.type==="date")return '<input data-uf type="date" value="'+esc(val)+'">';
 if(f.type==="datetime")return '<input data-uf type="datetime-local" value="'+esc(val)+'">';
 return '<input data-uf type="'+(f.type==="email"?"email":f.type==="url"?"url":"text")+'" value="'+esc(val)+'">';
}
function universal(){

 function editRecord(index){

function settings(){var s=S.settings||{};var navItems=Array.isArray(s.navigation)?s.navigation:[];app.innerHTML=head("Site settings","Global brand, contact, social, analytics and footer controls.",'<button class="btn primary" id="ss">Save settings</button>')+'<div class="settings">'+settingPanel("Branding",s.branding||{},["logo","favicon","primary","accent"])+settingPanel("Contact",s.contact||{},["email","whatsapp"])+settingPanel("Social",s.social||{},["instagram","facebook","youtube","x"])+settingPanel("Analytics",s.analytics||{},["google","meta"])+settingPanel("Site",s,["siteName","tagline","defaultTitle","defaultDescription"])+settingPanel("Footer",s.footer||{},["copyright","text"] )+'<section class="panel" style="grid-column:1/-1"><h3>Primary navigation</h3><div class="field" style="margin:12px"><label>One menu label per line. Use Label | URL for custom links.</label><textarea id="navitems" style="min-height:180px">'+esc(navItems.map(x=>typeof x==="string"?x:(x.label+" | "+x.url)).join("\n"))+'</textarea></div></section></div>';document.getElementById("ss").onclick=()=>{S.settings.navigation=(document.getElementById("navitems")?.value||"").split("\n").map(v=>v.trim()).filter(Boolean).map(v=>{var p=v.split("|");return p.length>1?{label:p[0].trim(),url:p.slice(1).join("|").trim()}:v});document.querySelectorAll("[data-setting]").forEach(e=>{var p=e.dataset.path.split(".");var o=S.settings;for(var i=0;i<p.length-1;i++)o=o[p[i]]||(o[p[i]]={});o[p[p.length-1]]=e.value});api("/api/cms/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({settings:S.settings})}).then(()=>flash("Site settings saved."))}}
