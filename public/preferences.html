<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Preferences — Frontier World</title></head><body><main id="main-content"><section class="page-hero"><div><p class="eyebrow">MY FRONTIER · PREFERENCES</p><h1>Make Frontier<br><em>fit your travel.</em></h1><p>Save a few basics so future planning can start closer to what you actually want.</p></div></section><section class="section"><form class="planner planner-premium" id="prefForm"><label>Display name<input id="display_name" autocomplete="name" required></label><label>Home city<input id="home_city" autocomplete="address-level2" placeholder="e.g. Delhi"></label><label>Travel style<select id="travel_style"><option>Balanced</option><option>Slow & scenic</option><option>Adventure</option><option>Food-led</option><option>Family</option><option>Comfort</option><option>Work from away</option></select></label><label class="full">Interests<input id="interests" placeholder="Food, mountains, cities, coast…"></label><button class="btn orange full" type="submit">Save preferences →</button><p id="prefStatus" role="status"></p></form></section></main><script src="/app.js?v=106"></script><script>(async function(){const r=await fetch('/api/profile');if(r.status===401){document.getElementById('prefForm').innerHTML='<div class="account-gate"><h2>Sign in to manage preferences.</h2><a class="btn orange" href="/login?returnTo=/preferences.html">Sign in / create account →</a></div>';return;}const d=await r.json(),p=d.profile||{};display_name.value=p.display_name||'';home_city.value=p.home_city||'';travel_style.value=p.travel_style||'Balanced';interests.value=p.interests||'';document.getElementById('prefForm').addEventListener('submit',async function(e){e.preventDefault();const x=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name:display_name.value,home_city:home_city.value,travel_style:travel_style.value,interests:interests.value})});document.getElementById('prefStatus').textContent=x.ok?'Preferences saved.':'Could not save yet.';});})();</script></body></html>
